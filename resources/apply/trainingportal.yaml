apiVersion: training.educates.dev/v1beta1
kind: TrainingPortal
metadata:
  name: spring-oauth2
spec:
  portal:
    sessions:
      anonymous: 2
      maximum: 180
    theme:
      frame:
        ancestors:
        - https://spring.academy
        - https://*.spring.academy
        - https://*.vmware.com
        - https://*.broadcom.com
        - https://spring-staging.academy
        - https://spring-academy.broadcom.com
        - https://spring-academy-verify.broadcom.com
        - https://spring-academy-qa.broadcom.net
        - https://spring-academy-dev.broadcom.net
        - http://localhost:8080
    updates:
      workshop: true
    workshop:
      defaults:
        expires: 60m
        orphaned: 5m
        reserved: ${TRAINING_PORTAL_RESERVED}
  analytics:
    google:
      trackingId: "${ANALYTICS_GOOGLE_ID}"
    clarity:
      trackingId: "${ANALYTICS_CLARITY_ID}"
  workshops:
  - name: spr-oauth2-unsecured-api
  - name: spr-oauth2-spring-defaults
  - name: spr-oauth2-bearer-jwt
  - name: spr-oauth2-accessing-auth
  - name: spr-oauth2-auth-anywhere
  - name: spr-oauth2-validating-audience
  - name: spr-oauth2-processing-failures
  - name: spr-oauth2-request-authorization
  - name: spr-oauth2-method-authorization
  - name: spr-oauth2-data-authorization
  - name: spr-oauth2-auth-server
  